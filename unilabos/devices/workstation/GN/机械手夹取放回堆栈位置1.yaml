name: 机械手夹取放回堆栈位置1
metadata:
  author: Prcxi
  source: OPC_UA协议1.3.5
  version: "1.3.5"
  description: |
    机械手在堆栈(ModuleNo=8)位置1(Action=1)夹取/放回的单点调试流程。
    YAML 字段 → OPC 节点：
      XPos / XSpeed     → Robot_XPosSet / Robot_XSpeedSet
      ModuleNo          → Robot_ModuleNoSet（Stack=8）
      StationAction     → Robot_Stack（堆栈工站运行动作，1=位置1）
      ManipulatorCmd    → Robot_CmdType（GripperTake=3, GripperPut=4）
stages:
  stage1:
    name: stage1
    jobs:
      job1:
        name: job1
        steps:
          step0:
            step: robotgrippertake
            name: 堆栈位置1夹爪夹料
            with:
              XPos: 3274
              XSpeed: 300
              ModuleNo: 8
              StationAction: 1
              ManipulatorCmd: GripperTake
              IsWait: true
          step1:
            step: robotgripperput
            name: 堆栈位置1夹爪放料
            with:
              XPos: 3274
              XSpeed: 300
              ModuleNo: 8
              StationAction: 1
              ManipulatorCmd: GripperPut
              IsWait: true
        with: {}
        plugins: {}
